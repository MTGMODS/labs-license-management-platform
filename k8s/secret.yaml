apiVersion: v1
kind: Secret
metadata:
  name: license-secrets
type: Opaque
stringData:
  # Demonstration-only credentials for the isolated local Minikube cluster.
  POSTGRES_USER: "mtg_license"
  POSTGRES_PASSWORD: "lab-license-password"
  POSTGRES_DB: "licenses"
  DATABASE_URL: "postgresql+asyncpg://mtg_license:lab-license-password@license-postgres:5432/licenses"
  DATABASE_POSTGRES_URL: "postgresql+asyncpg://mtg_license:lab-license-password@license-postgres:5432/licenses"
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
  JWT_SECRET: "lab-only-jwt-secret-at-least-32-characters"
  BOT_SECRET_TOKEN: "lab-only-bot-secret"
  INTERNAL_SECRET_TOKEN: "lab-only-internal-secret"

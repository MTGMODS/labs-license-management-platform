apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mtgmods-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/MTGMODS/labs-license-management-platform.git
    targetRevision: codex/devops-lab6-progressive-delivery
    path: argocd-apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

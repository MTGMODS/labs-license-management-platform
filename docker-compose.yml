name: mtgmods_backend

services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  user-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./services/user/.env
    volumes:
      - user_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  license-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./services/license/.env
    volumes:
      - license_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  usage-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./services/usage/.env
    volumes:
      - usage_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    env_file:
      - ./services/license/.env
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  user-service:
    build:
      context: ./services/user
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./services/user/.env
    ports:
      - "8001:8000"
    depends_on:
      user-postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  license-service:
    build:
      context: ./services/license
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./services/license/.env
    ports:
      - "8002:8000"
    depends_on:
      license-postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      user-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  usage-service:
    build:
      context: ./services/usage
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./services/usage/.env
    ports:
      - "8003:8000"
    depends_on:
      usage-postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  distribution-service:
    build:
      context: ./services/distribution
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./services/distribution/.env
    ports:
      - "8005:8000"
    volumes:
      - ./services/distribution/app/builds:/app/app/builds
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.mtgmods.com}
    restart: unless-stopped
    ports:
      - "8080:8080"

  telegram-bot:
    build:
      context: ./bots/telegram
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./bots/telegram/.env
    depends_on:
      rabbitmq:
        condition: service_healthy
      license-service:
        condition: service_healthy

  discord-bot:
    build:
      context: ./bots/discord
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./bots/discord/.env
    depends_on:
      rabbitmq:
        condition: service_healthy
      license-service:
        condition: service_healthy

volumes:
  user_pg_data:
  license_pg_data:
  usage_pg_data:

apiVersion: v1
kind: Service
metadata:
  name: {{ include "mtgmods-license.fullname" . }}-postgres
  labels:
    {{- include "mtgmods-license.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "mtgmods-license.componentLabels" (dict "Release" .Release "Chart" .Chart "Values" .Values "component" "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: {{ .Values.postgres.port }}
      targetPort: postgres

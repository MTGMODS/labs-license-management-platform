{{- if not .Values.rollout.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mtgmods-license.fullname" . }}
  labels:
    {{- include "mtgmods-license.labels" . | nindent 4 }}
  {{- if .Values.gitops.enabled }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if .Values.gitops.enabled }}
  progressDeadlineSeconds: {{ .Values.gitops.progressDeadlineSeconds }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "mtgmods-license.componentLabels" (dict "Release" .Release "Chart" .Chart "Values" .Values "component" "api") | nindent 6 }}
  template:
    {{- include "mtgmods-license.podTemplate" . | nindent 4 }}
{{- end }}

apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "mtgmods-license.fullname" . }}-db-init-{{ if .Values.gitops.enabled }}sync{{ else }}{{ .Release.Revision }}{{ end }}
  labels:
    {{- include "mtgmods-license.labels" . | nindent 4 }}
  {{- if .Values.gitops.enabled }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
  {{- end }}
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "mtgmods-license.componentLabels" (dict "Release" .Release "Chart" .Chart "Values" .Values "component" "db-init") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.postgres.image | quote }}
          command:
            - sh
            - -c
            - until pg_isready -h {{ include "mtgmods-license.fullname" . }}-postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do sleep 2; done
          envFrom:
            - secretRef:
                name: {{ include "mtgmods-license.secretName" . }}
      containers:
        - name: schema-init
          image: "{{ .Values.image.repository }}:{{ if .Values.gitops.enabled }}{{ required "gitops.schemaImageTag is required in GitOps mode" .Values.gitops.schemaImageTag }}{{ else }}{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "db_init.py"]
          envFrom:
            - configMapRef:
                name: {{ include "mtgmods-license.fullname" . }}-config
            - secretRef:
                name: {{ include "mtgmods-license.secretName" . }}

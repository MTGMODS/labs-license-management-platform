# Lab 6 adds progressive delivery to the GitOps configuration from lab 5.
replicaCount: 5

image:
  tag: sha-b200fa774adfe73da92ea630f25b6e399c3beb43

config:
  appVersion: devops-lab6-v3

rollout:
  enabled: true
  strategy:
    canary:
      maxSurge: 1
      maxUnavailable: 0
      steps:
        - setWeight: 20
        - pause: {}
        - setWeight: 60
        - pause:
            duration: 30s
        - setWeight: 80
        - pause:
            duration: 30s

gitops:
  progressDeadlineSeconds: 180

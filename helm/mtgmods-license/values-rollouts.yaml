# Lab 6 adds progressive delivery to the GitOps configuration from lab 5.
replicaCount: 5

image:
  tag: sha-07f44c2e07c73ad805d978dedb06ca231f3f8850

config:
  appVersion: devops-lab6-v2

rollout:
  enabled: true
  strategy:
    canary:
      maxSurge: 1
      maxUnavailable: 0
      steps:
        - setWeight: 20
        - pause: {}
        - setWeight: 60
        - pause:
            duration: 30s
        - setWeight: 80
        - pause:
            duration: 30s

gitops:
  progressDeadlineSeconds: 180

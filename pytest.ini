[pytest]
testpaths = tests
filterwarnings =
    # discord.py imports Python 3.12's deprecated audioop; keep other warnings visible.
    ignore:'audioop' is deprecated and slated for removal in Python 3\.13:DeprecationWarning:discord\.player
markers =
    component(path): isolate imports and configuration for one service or bot
    integration: exercises real API, database or filesystem components
    unit: isolated business logic with external dependencies replaced

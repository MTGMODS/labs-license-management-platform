apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mtgmods-license
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/MTGMODS/labs-license-management-platform.git
    targetRevision: main
    path: helm/mtgmods-license
    helm:
      valueFiles:
        - values-minikube.yaml
        - values-rollouts.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: mtgmods-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true

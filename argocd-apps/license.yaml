apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mtgmods-license
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/MTGMODS/labs-license-management-platform.git
    targetRevision: codex/devops-lab5-gitops
    path: helm/mtgmods-license
    helm:
      valueFiles:
        - values-minikube.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: mtgmods-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
